    <text x="126" y="177" font-family="Microsoft JhengHei, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#eaf0ff">ㄅ</text>
    <text x="160" y="177" font-family="Microsoft JhengHei, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#eaf0ff">?</text>

