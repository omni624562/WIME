name: Build

# 功能分支由 pull_request 檢查；以前 push 不限分支，同一個 commit 會在分支 push
# 與 PR 各跑一次，推 tag 又把 master 已建置過的 commit 再建一次。只設 branches
# 時 tag push 不會觸發。沒開 PR 的分支或 tag 需要時從 Actions 頁手動執行。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一個 PR 又推新 commit 時，自動取消還在跑的舊 run（它的結果已經沒有用）。
# master 的 run 不取消：每個合併都要有自己的結果。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      # aarch64：build.bat 另外編 ARM64 原生版的啟動器、後端與設定工具給安裝檔
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Run Rust tests (PIMELauncher)
        run: |
          cd PIMELauncher
          cargo test --verbose

      # The embedded 32-bit Python in python\python3 runs the Python reference
      # implementation the tests compare the Rust backend and settings tool against
      # (the installer itself ships no Python since 1.3.0-beta18), and
      # python\libchewing\chewing.dll needs a 32-bit Python.
      # The CinBase keystroke/loading tests (tests/cinbase_harness.py) drive the
      # real 大易/酷倉 tables and are skipped without them; build.bat generates the
      # same files again later (it skips tables that are already up to date).
      - name: Generate CinBase tables
        run: |
          .\python\python3\python.exe python\cinbase\tools\cintojson.py

      # Rust 版後端與設定工具（大易、酷倉、新酷音）：單元測試（含和 Python 逐項比對），
      # 並建出 release 版，讓下面的 tests/test_diffharness.py 拿它和 golden 標準答案比對
      - name: Build and test cinbase-rs (Rust 後端與設定工具)
        run: |
          cd cinbase-rs
          cargo test --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release

      # wime-config.exe（Rust 版設定工具）由上面的 cinbase-rs 步驟建出；設定工具的
      # 端對端與差異測試同時跑 Python 版與 Rust 版，執行檔缺了就算失敗
      - name: Run Python backend tests
        env:
          WIME_REQUIRE_RUST_CONFIG: "1"
        run: |
          .\python\python3\python.exe -m unittest discover -s tests -p "*.py" -v

      - name: Install NSIS
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: 3.08

      # Builds x86 (everything, incl. PIMELauncher and the C++ tests), plus the
      # x64 and ARM64 PIMETextService.dll and the ARM64 PIMELauncher.exe,
      # wime-cinbase.exe and wime-config.exe. Stops at the first failing step.
      # (No Rust_COMPILER override: `${{ env.CARGO_HOME }}` only sees workflow-level
      # env, so it expanded to "\bin\rustc.exe". Corrosion finds rustc on PATH.)
      # On failure, the error lines and log tail are also emitted as annotations so
      # they are visible without opening the full log.
      - name: Run build.bat
        shell: pwsh
        run: |
          cmd /C build.bat *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) {
            function Annotate($title, $lines) {
              $text = ($lines -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=$title::$text"
            }
            Annotate "build.bat error lines (exit $code)" (Select-String -Path build.log -Pattern 'error|Error|FAILED' | Select-Object -First 25 | ForEach-Object { $_.Line })
            Annotate "build.bat log tail" (Get-Content build.log -Tail 30)
            exit $code
          }

      # 三種架構的 PIMETextService.dll 都要真的帶 CFG（連結時要 /GUARD:CF，見
      # PIMETextService/CMakeLists.txt）；DLL 缺了也算失敗
      - name: Check DLL hardening (Control Flow Guard)
        env:
          WIME_REQUIRE_DLLS: "1"
        run: |
          .\python\python3\python.exe -m unittest discover -s tests -p "test_dll_hardening.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run C++ tests (libIME2, incl. candidate window rendering)
        run: |
          cd build
          ctest -C Release --output-on-failure

      - name: Build the installer (dayi/chewing/checj only)
        run: |
          cmd /C "C:\Program Files (x86)\NSIS\Bin\makensis.exe" "/DNO_SIMP_CHINESE" "/DONLY_DAYI_CHEWING_CHECJ" ".\installer\installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 安裝檔裡沒有 Python：另外編譯一份到暫存檔（/V4 記錄每個打包的檔案），檢查清單裡
      # 沒有 Python、ime.json／捷徑／backends.json 指到的檔案都在；再把清單複製到暫存資料夾，
      # 從那裡實際執行設定工具與後端（tests/test_packaging.py）。建置產物缺了就算失敗
      - name: Check the installer contents (no Python)
        env:
          WIME_REQUIRE_INSTALLER: "1"
        run: |
          .\python\python3\python.exe -m unittest discover -s tests -p "test_packaging.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: Installer
          path: installer/*.exe

  # ARM64 原生版（安裝檔在 ARM64 Windows 裝的那一份）在真的 ARM64 Windows 上測：Rust
  # 單元測試，以及整套 Python 測試改拿 ARM64 版的後端與設定工具，和 Python 參考實作
  # 逐位元組比對（golden、隨機情境、設定工具）。內嵌的 32 位元 Python 在這裡靠模擬執行。
  arm64:
    runs-on: windows-11-arm
    env:
      WIME_CINBASE_EXE: ${{ github.workspace }}\cinbase-rs\target\aarch64-pc-windows-msvc\release\wime-cinbase.exe
      WIME_CONFIG_EXE: ${{ github.workspace }}\cinbase-rs\target\aarch64-pc-windows-msvc\release\wime-config.exe
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Run Rust tests (PIMELauncher, ARM64)
        run: |
          cd PIMELauncher
          cargo test --release --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate CinBase tables
        run: |
          .\python\python3\python.exe python\cinbase\tools\cintojson.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test cinbase-rs (ARM64)
        run: |
          cd cinbase-rs
          cargo test --release --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python tests against the ARM64 backend and settings tool
        env:
          WIME_REQUIRE_RUST_CONFIG: "1"
        run: |
          .\python\python3\python.exe -m unittest discover -s tests -p "*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
