name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Run Rust tests
        run: |
          cd PIMELauncher
          cargo test --verbose
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python backend tests
        run: |
          python -m unittest discover -s tests -p "*.py" -v
      - name: Use Install NSIS
        uses: repolevedavaj/install-nsis@v1.2.0
        with:
          nsis-version: 3.08
      - name: Run build.bat
        env:
          Rust_COMPILER: ${{ env.CARGO_HOME }}\bin\rustc.exe
        run: |
          .\build.bat
      - name: Build the installer (dayi/chewing/checj only)
        run: |
          cmd /C "C:\Program Files (x86)\NSIS\Bin\makensis.exe" "/DONLY_DAYI_CHEWING_CHECJ" ".\installer\installer.nsi"
      - uses: actions/upload-artifact@v4
        with:
          name: Installer
          path: installer/*.exe
