<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180">
  <rect width="560" height="180" fill="#252525"/>

  <g transform="translate(26 24)">
    <rect x="0" y="0" width="288" height="88" rx="7" fill="#201a12" stroke="#5d4529" stroke-opacity=".45"/>
    <line x1="0" y1="34" x2="288" y2="34" stroke="#6a4f2e" stroke-opacity=".38"/>
    <text x="12" y="22" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#fff2df">大易</text>
    <text x="50" y="22" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#ffc46f">魚</text>
    <text x="250" y="22" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#f1dcc0">1/2</text>

    <g transform="translate(10 45)">
      <!-- Selected item: weak outer fill, no strong outer border -->
      <rect x="0" y="-7" width="54" height="28" rx="6" fill="#d59a58" fill-opacity=".22" stroke="#fff4d6" stroke-opacity=".08"/>
      <!-- Keycap: focus remains on the selection key -->
      <rect x="7" y="-3" width="20" height="20" rx="4" fill="#9a6730" stroke="#ffd79a" stroke-opacity=".78"/>
      <text x="17" y="12" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#fff3de">␣</text>
      <text x="32" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#fff7e8">刀</text>

      <text x="78" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#f8efd9">' 川</text>
      <text x="130" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#f8efd9">[ 夕</text>
      <text x="183" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#f8efd9">] 角</text>
      <text x="238" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="15" fill="#f8efd9">- 魚</text>
    </g>
  </g>

  <g transform="translate(26 130)">
    <rect x="0" y="-18" width="18" height="18" rx="4" fill="#9a6730" stroke="#ffd79a" stroke-opacity=".78"/>
    <text x="28" y="-5" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="#e8dfd2">保留內層 keycap 框線</text>
    <rect x="200" y="-20" width="50" height="22" rx="6" fill="#d59a58" fill-opacity=".22" stroke="#fff4d6" stroke-opacity=".08"/>
    <text x="260" y="-5" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="#e8dfd2">外層選取底色淡化，外框弱化</text>
  </g>
</svg>
