[package]
name = "wime-cintojson"
version = "0.1.0"
edition = "2021"
description = "Build tool: converts the cinbase *.cin tables to the JSON the backend loads (a port of python/cinbase/tools/cintojson.py)"
license = "LGPL-2.1-or-later"

[dependencies]
# no preserve_order: the output has sorted keys, like json.dump(sort_keys=True)
serde_json = "1"
