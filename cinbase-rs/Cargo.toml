[package]
name = "wime-cinbase"
version = "0.1.0"
edition = "2021"
description = "WIME input methods (大易, 酷倉, 新酷音) as a standalone backend for PIMELauncher"
license = "LGPL-2.1-or-later"

[lib]
# shared by both executables: the input methods and the settings tools
name = "wime"
path = "src/lib.rs"

[[bin]]
name = "wime-cinbase"
path = "src/main.rs"

[dependencies]
# preserve_order: table JSON object order is significant (candidate order,
# reverse index order), exactly like Python dicts
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_Storage_FileSystem",
] }
# 新酷音: upstream libchewing (submodule libchewing, tag v0.13.1) linked
# in-process through its C API crate -- the same code python/libchewing/chewing.dll
# is built from (tools/build_libchewing.ps1), so the engine behaves exactly like
# the DLL the Python backend loads. sqlite-bundled: like the DLL, to convert the
# old chewing.sqlite3 user dictionary.
chewing_capi = { path = "../libchewing/capi", features = ["sqlite-bundled"] }
# the rusqlite of libchewing's Cargo.lock: checking, copying and cleaning the old
# user dictionary before the conversion (python/libchewing/userdict.py)
rusqlite = { version = "=0.39.0", features = ["bundled", "backup"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic in one request must not take the other clients down: the server
# catches it and answers {"success":false} like server.py does for exceptions
panic = "unwind"
strip = true
