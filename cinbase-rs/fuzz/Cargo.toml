[package]
name = "wime-cinbase-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wime-cinbase = { path = ".." }

# a workspace of its own: the fuzz build (nightly, sanitizer flags) never touches
# the crate's Cargo.lock or target folder
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "backend"
path = "fuzz_targets/backend.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backend_raw"
path = "fuzz_targets/backend_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_http"
path = "fuzz_targets/config_http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "multipart"
path = "fuzz_targets/multipart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_fields"
path = "fuzz_targets/http_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_body"
path = "fuzz_targets/json_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "user_dictionary"
path = "fuzz_targets/user_dictionary.rs"
test = false
doc = false
bench = false
